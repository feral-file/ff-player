<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title></title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
    <script>
      // Opens the data: URL carried in this page's fragment as a document of
      // this page's origin, http://<label>.localhost:<port>. The player picks
      // <label> as the hex of the first 16 bytes of SHA-256 over that data: URL
      // (fragment excluded); see src/utils/dataDocument.ts and keep the two in
      // step. This page refuses any URL whose hash is not its own hostname, so
      // the origin can only ever run the exact bytes it names, and no other
      // page can reach a work's storage by loading different bytes here.
      // Static on purpose: any other bundle page would boot the player app.
      (async () => {
        const source = decodeURIComponent(location.hash.slice(1));
        const hashAt = source.indexOf('#');
        const body = hashAt === -1 ? source : source.slice(0, hashAt);
        const fragment = hashAt === -1 ? '' : source.slice(hashAt);
        const digest = await crypto.subtle.digest(
          'SHA-256',
          new TextEncoder().encode(body)
        );
        const label = Array.from(new Uint8Array(digest).slice(0, 16), b =>
          b.toString(16).padStart(2, '0')
        ).join('');
        if (!/^data:/i.test(body) || location.hostname !== label + '.localhost') {
          console.error('[data-document] refused: content does not match this origin');
          return;
        }
        // fetch() decodes the data: URL exactly as Chromium would (base64,
        // percent-escapes, media type and charset) into a Blob of this origin.
        const blob = await (await fetch(body)).blob();
        location.replace(URL.createObjectURL(blob) + fragment);
      })().catch(error => {
        console.error('[data-document]', error);
      });
    </script>
  </head>
  <body></body>
</html>
