name: Build and Export

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build'
        required: false
        default: 'Development'
        type: choice
        options:
          - Development
          - Production
  release:
    types: [published]

jobs:
  build-export:
    runs-on: ubuntu-latest
    env:
      BUILD_ENVIRONMENT: ${{ github.event_name == 'release' && 'Production' || (github.event.inputs.environment != '' && github.event.inputs.environment || 'Development') }}
    environment: ${{ env.BUILD_ENVIRONMENT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Set environment variables
        run: |
          echo "NEXT_PUBLIC_INDEXER_MAINNET_URL=${{ vars.INDEXER_MAINNET_URL }}" >> .env.local
          echo "NEXT_PUBLIC_ACCOUNTS_URL=${{ vars.ACCOUNTS_URL }}" >> .env.local
          echo "NEXT_PUBLIC_AUTONOMY_IPFS_PREFIX=${{ vars.AUTONOMY_IPFS_PREFIX }}" >> .env.local
          echo "NEXT_PUBLIC_FERAL_FILE_ASSET_URL=${{ vars.FERAL_FILE_ASSET_URL }}" >> .env.local
          echo "NEXT_PUBLIC_API_URL=${{ vars.API_URL }}" >> .env.local
          echo "NEXT_PUBLIC_PUB_DOC_URL=${{ vars.PUB_DOC_URL }}" >> .env.local
          echo "NEXT_PUBLIC_WEBSOCKET_URL=${{ vars.WEBSOCKET_URL }}" >> .env.local
          echo "NEXT_PUBLIC_ACCOUNTS_API_KEY=${{ secrets.ACCOUNTS_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_API_KEY=${{ secrets.WEBSOCKET_API_KEY }}" >> .env.local
          echo "NEXT_PUBLIC_ENVIRONMENT=${{ vars.ENVIRONMENT }}" >> .env.local
          echo "NEXT_PUBLIC_SENTRY_DSN=${{ vars.SENTRY_DSN }}" >> .env.local
          echo "NEXT_PUBLIC_SUPPORT_API_URL=${{ vars.SUPPORT_API_URL }}" >> .env.local
          echo "NEXT_PUBLIC_INFURA_ENDPOINT=${{ secrets.INFURA_ENDPOINT }}" >> .env.local
          echo "NEXT_PUBLIC_SUPPORT_API_KEY=${{ secrets.SUPPORT_API_KEY }}" >> .env.local

      - uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build and export static site
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build:static

      - name: Write the current version hash
        run: |
          mkdir -p out
          echo "{\"version\": \"$(git rev-parse HEAD)\"}" > out/version.json

      - name: Upload exported site
        uses: actions/upload-artifact@v4
        with:
          name: feralfile-display-${{ env.BUILD_ENVIRONMENT }}-${{ github.run_id }}
          path: out
          if-no-files-found: error
