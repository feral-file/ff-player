name: Build Tizen

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to build'
        required: false
        default: 'Development'
        type: choice
        options:
          - Development
          - Production

jobs:
  build:
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'Production' || 'Development') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt -y install libpython2.7 python2.7 libncurses5
          sudo apt -y install cpio rpm2cpio libkf5itemmodels5 libkf5kiowidgets5 libkchart2
        shell: bash

      - uses: actions/setup-dotnet@v4
        env: 
          DOTNET_INSTALL_DIR: $GITHUB_WORKSPACE/dotnet
        with:
          dotnet-version: '6.0.x'

      - name: Install Tizen studio
        run: |
          curl http://download.tizen.org/sdk/Installer/tizen-studio_5.6/web-cli_Tizen_Studio_5.6_ubuntu-64.bin > tizen-studio.bin
          chmod 755 tizen-studio.bin
          mkdir tizen-studio
          ./tizen-studio.bin --no-java-check --accept-license $GITHUB_WORKSPACE/tizen-studio
          rm tizen-studio.bin
        shell: bash

      - uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: |
            ${{ secrets.KEY_VAULT_DEPLOYMENT_KEY }}

      - name: Checkout certificate
        run: git clone git@github.com:bitmark-inc/mobile-signing-key-vault.git --depth 1

      - run: |
          export PATH=$GITHUB_WORKSPACE/tizen-studio/tools:$GITHUB_WORKSPACE/tizen-studio/tools/ide/bin:$PATH
          tizen security-profiles add -A -n ActionsProfile -a mobile-signing-key-vault/tizen/author.p12 -p ${{ secrets.TIZEN_CER_AUTHOR_PASSWORD }} -d  mobile-signing-key-vault/tizen/distributor.p12 -dp ${{ secrets.TIZEN_CER_DISTRIBUTOR_PASSWORD }}
          tizen cli-config "profiles.path=$GITHUB_WORKSPACE/tizen-studio-data/profile/profiles.xml"
        shell: bash

      - run: |
          git clone https://github.com/flutter-tizen/flutter-tizen.git
        shell: bash

      - run: |
          export PATH=$GITHUB_WORKSPACE/tizen-studio/tools:$GITHUB_WORKSPACE/tizen-studio/tools/ide/bin:$PATH
          export PATH=$GITHUB_WORKSPACE/tizen-studio/package-manager:$PATH
          export PATH=$GITHUB_WORKSPACE/flutter-tizen/bin:$PATH
          package-manager-cli.bin install --accept-license NativeCLI NativeToolchain-Gcc-9.2 Certificate-Manager cert-add-on tv-5.0-samsung-public-NativeAppDevelopment-CLI
          package-manager-cli.bin install IOT-Headed-6.0-NativeAppDevelopment-CLI
          tizen cli-config -l
          cat tizen-studio-data/profile/profiles.xml
        shell: bash

      - name: Write secrets to .env file
        run: |
          cd platforms/samsung
          echo "PUB_DOC_URL = ${{ vars.PUB_DOC_URL }}" >> .env
          echo "SUPPORT_URL = ${{ vars.SUPPORT_URL }}" >> .env
          
          echo "SUPPORT_API_KEY = ${{ secrets.SUPPORT_API_KEY }}" >> .env

      - name: Install Flutter dependencies and build app
        run: |
          export PATH=$GITHUB_WORKSPACE/flutter-tizen/bin:$PATH
          export PATH=$GITHUB_WORKSPACE/tizen-studio/tools/ide/bin:$PATH
          export PATH=$GITHUB_WORKSPACE/tizen-studio/tools:$PATH
          cd platforms/samsung
          flutter-tizen pub get
          flutter-tizen build tpk --release --device-profile tv
        shell: bash

      - name: Upload TPK
        uses: actions/upload-artifact@v4
        with:
          name: Tizen-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'Production' || 'Development') }}-${{ github.event.number }}
          path: platforms/samsung/build/tizen/tpk/com.bitmark.feralfile.display-*.tpk
          retention-days: 1
          overwrite: true