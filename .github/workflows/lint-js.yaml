name: Lint JS

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**.ts'
      - '**.tsx'

jobs:
  lint:
    name: Lint
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./package-lock.json

    - name: Install dependencies
      run: npm install

    - name: TYPO check
      uses: reviewdog/action-typos@v1
      with:
        reporter: github-pr-review

    - uses: reviewdog/action-eslint@v1
      with:
        reporter: github-pr-review
        eslint_flags: "src/"