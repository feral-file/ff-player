name: Lint JS

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.mjs'
      - 'scripts/lint-changed.sh'
      - '.github/workflows/lint-js.yaml'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: lint-js-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch base branch
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Run ESLint and collect advisory results
        id: eslint
        shell: bash
        run: |
          set -euo pipefail

          merge_base="$(git merge-base "origin/${{ github.base_ref }}" HEAD)"
          changed_files=()
          while IFS= read -r -d '' file; do
            changed_files+=("$file")
          done < <(
            git diff --name-only --diff-filter=ACMR -z "$merge_base" -- \
              '*.js' \
              '*.jsx' \
              '*.ts' \
              '*.tsx' \
              '*.mjs' \
              '*.cjs'
          )

          existing_files=()
          for file in "${changed_files[@]}"; do
            if [[ -f "$file" ]]; then
              existing_files+=("$file")
            fi
          done

          if [[ "${#existing_files[@]}" -eq 0 ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_files=true" >> "$GITHUB_OUTPUT"
          printf 'Linting advisory scope:\n - %s\n' "${existing_files[@]}"

          eslint_exit=0
          if npx eslint --format=rdjson "${existing_files[@]}" > eslint.rdjson; then
            eslint_exit=0
          else
            eslint_exit=$?
          fi

          echo "eslint_exit=$eslint_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report ESLint violations inline
        if: steps.eslint.outputs.has_files == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog \
            -f=rdjson \
            -name="eslint" \
            -reporter=github-pr-review \
            -fail-on-error=false \
            < eslint.rdjson

      - name: Summarize advisory lint result
        if: steps.eslint.outputs.has_files == 'true'
        run: |
          if [[ "${{ steps.eslint.outputs.eslint_exit }}" != "0" ]]; then
            echo "Lint violations were reported as inline review comments, but this advisory job does not fail the check."
          else
            echo "No lint violations found in changed files."
          fi
